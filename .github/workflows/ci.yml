name: Public compiler validation

on:
  push:
    branches: [main, codex/rearm-reconstruction]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-validation-${{ github.ref }}
  # Autonomous checkpoints can arrive faster than the full validation suite.
  # Let the running checkpoint finish; GitHub retains only the newest pending run.
  cancel-in-progress: false

jobs:
  linux-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang-18
      CXX: clang++-18
      REARM_JOBS: "4"
      REARM_INSTALL_BROWSER: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install baseline host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 cmake ninja-build zlib1g-dev python3-venv nodejs
      - name: Bootstrap locked dependencies and build
        run: bash tools/bootstrap.sh
      - name: Native loader and compiler tests
        run: |
          ctest --test-dir build/recomp --output-on-failure --no-tests=error
          build/venv/bin/python -m unittest discover -s tests/reference -p 'test_*.py' -v
          build/venv/bin/python -m unittest discover -s tests/inventory -p 'test_*.py' -v
          build/venv/bin/python -m unittest discover -s tools -p 'test_check_pthreads.py' -v
          node --test tools/download.test.mjs
          build/venv/bin/python tests/reference/check_unsupported.py \
            --rearm build/recomp/rearm --clang clang-18 \
            --sla third_party/sla/ARM/ARM7_le.sla
      - name: Install pinned Chromium and system libraries
        run: build/venv/bin/python -m playwright install --with-deps chromium
      - name: ARM ELF to native and WASM differential validation
        run: |
          for fixture in early_pipeline condition_flags interworking thumb_it; do
            extension=c
            if [ "$fixture" = thumb_it ]; then extension=S; fi
            build/venv/bin/python tools/validate_e2e.py \
              --rearm build/recomp/rearm \
              --sla third_party/sla/ARM/ARM7_le.sla \
              --clang clang-18 --cxx clang++-18 \
              --emxx third_party/emsdk/upstream/emscripten/em++ \
              --fixture "tests/fixtures/$fixture.$extension" \
              --out "build/e2e-$fixture" --node node --browser
          done
      - name: Large BSS and PIC relocation validation
        run: |
          build/venv/bin/python tools/validate_e2e.py \
            --rearm build/recomp/rearm --sla third_party/sla/ARM/ARM7_le.sla \
            --clang clang-18 --cxx clang++-18 \
            --emxx third_party/emsdk/upstream/emscripten/em++ \
            --fixture tests/emitter/bss.c --out build/e2e-bss --browser
          build/venv/bin/python -c "import json; r=json.load(open('build/e2e-bss/metrics.json')); assert r['passed']; assert max(a['size_bytes'] for a in r['artifacts'] if a['path'].endswith('.cpp')) < 131072"
          for bias in 0x10000000 0x20000000; do
            build/venv/bin/python tools/validate_e2e.py \
              --rearm build/recomp/rearm --sla third_party/sla/ARM/ARM7_le.sla \
              --clang clang-18 --cxx clang++-18 \
              --emxx third_party/emsdk/upstream/emscripten/em++ \
              --fixture tests/fixtures/shared_relocations.c --shared --load-bias "$bias" \
              --out "build/e2e-shared-$bias" --browser
          done
      - name: Linked libraries and constructor execution
        run: |
          build/venv/bin/python tools/validate_link.py \
            --rearm build/recomp/rearm --sla third_party/sla/ARM/ARM7_le.sla \
            --input build/recomp/link-fixtures/libconsumer.so --load-bias 0x10000000 \
            --dependency build/recomp/link-fixtures/libprovider.so@0x20000000 \
            --cxx clang++-18 --emxx third_party/emsdk/upstream/emscripten/em++ \
            --out build/e2e-linked --browser
      - name: Public JNI_OnLoad guest-to-host validation
        run: |
          build/venv/bin/python tools/validate_jni.py \
            --rearm build/recomp/rearm --sla third_party/sla/ARM/ARM7_le.sla \
            --clang clang-18 --cxx clang++-18 \
            --emxx third_party/emsdk/upstream/emscripten/em++ \
            --out build/jni-e2e --browser
      - name: Registered JNI native callbacks and stack marshalling
        run: |
          build/venv/bin/python tools/validate_jni.py --registered --stack \
            --rearm build/recomp/rearm --sla third_party/sla/ARM/ARM7_le.sla \
            --clang clang-18 --cxx clang++-18 \
            --emxx third_party/emsdk/upstream/emscripten/em++ \
            --out build/jni-registered-stack --browser
      - name: Explicit libc memory imports
        run: |
          build/venv/bin/python tools/validate_libc.py \
            --rearm build/recomp/rearm --sla third_party/sla/ARM/ARM7_le.sla \
            --clang clang-18 --cxx clang++-18 \
            --emxx third_party/emsdk/upstream/emscripten/em++ \
            --out build/libc-e2e --browser
          build/venv/bin/python tools/check_libc_profile.py \
            --rearm build/recomp/rearm --sla third_party/sla/ARM/ARM7_le.sla \
            --clang clang-18 --fixture build/libc-e2e/arm-O2/libfixture.so \
            --stub-dir build/libc-e2e --out build/libc-negative
      - name: Guest allocator imports and errno
        run: |
          build/venv/bin/python tools/validate_libc.py --allocator \
            --rearm build/recomp/rearm --sla third_party/sla/ARM/ARM7_le.sla \
            --clang clang-18 --cxx clang++-18 \
            --emxx third_party/emsdk/upstream/emscripten/em++ \
            --out build/allocator-e2e --browser
          build/venv/bin/python tools/check_libc_profile.py \
            --rearm build/recomp/rearm --sla third_party/sla/ARM/ARM7_le.sla \
            --clang clang-18 --fixture build/libc-e2e/arm-O2/libfixture.so \
            --stub-dir build/libc-e2e --allocator-fixture build/allocator-e2e/arm-O2/libfixture.so \
            --out build/allocator-negative
      - name: Optional static instruction functions
        run: |
          build/venv/bin/python tools/validate_link.py \
            --input build/allocator-e2e/arm-O2/libfixture.so --runtime libc-basic \
            --codegen functions --rearm build/recomp/rearm \
            --sla third_party/sla/ARM/ARM7_le.sla --cxx clang++-18 \
            --emxx third_party/emsdk/upstream/emscripten/em++ --browser \
            --out build/functions-allocator
          build/venv/bin/python tools/validate_link.py \
            --input build/jni-registered-stack/thumb-O2/libjni.so \
            --entry JNI_OnLoad --jni-onload --jni-registered --jni-stack \
            --codegen functions --rearm build/recomp/rearm \
            --sla third_party/sla/ARM/ARM7_le.sla --cxx clang++-18 \
            --emxx third_party/emsdk/upstream/emscripten/em++ --browser \
            --out build/functions-jni
      - name: Guest JNI string regions
        run: |
          build/venv/bin/python tools/validate_jni.py --strings --codegen functions \
            --rearm build/recomp/rearm --sla third_party/sla/ARM/ARM7_le.sla \
            --clang clang-18 --cxx clang++-18 \
            --emxx third_party/emsdk/upstream/emscripten/em++ \
            --out build/jni-strings --browser
      - name: Guest JNI copied string leases
        run: |
          build/venv/bin/python tools/validate_jni.py --leases --codegen functions \
            --rearm build/recomp/rearm --sla third_party/sla/ARM/ARM7_le.sla \
            --clang clang-18 --cxx clang++-18 \
            --emxx third_party/emsdk/upstream/emscripten/em++ \
            --out build/jni-string-leases --browser
      - name: Preserved M0 pthread smoke
        run: |
          build/venv/bin/python tools/check_pthreads.py \
            --emcc third_party/emsdk/upstream/emscripten/emcc --node node --browser
      - name: Retain public-fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-validation-evidence
          path: |
            build/evidence/
            build/e2e-*/*.json
            build/negative/*.json
            build/m0-pthreads/*.json
            build/jni-e2e/metrics.json
            build/jni-registered-stack/metrics.json
            build/libc-e2e/metrics.json
            build/libc-negative/metrics.json
            build/allocator-e2e/metrics.json
            build/allocator-negative/metrics.json
            build/functions-*/*.json
            build/jni-strings/metrics.json
            build/jni-string-leases/metrics.json
            build/recomp/Testing/Temporary/LastTest.log
          if-no-files-found: warn
